<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuro & Lena - Wedding Invitation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Poppins:wght@300;500&display=swap');
  body { margin:0; font-family:'Poppins', sans-serif; background:#1a100a; color:#fff; text-align:center; }
  .hero { position:relative; height:100vh; background: url('./kuro-lena-hero.webp') center/cover no-repeat; display:flex; flex-direction:column; justify-content:end; padding-bottom:80px; }
  .hero::after { content:''; position:absolute; inset:0; background: linear-gradient(to top, #1a100a 10%, transparent 70%); }
  .hero-content { position:relative; z-index:2; }
  h1 { font-family:'Cinzel Decorative', serif; font-size:3rem; color:#ffd700; margin:0; text-shadow:0 0 20px rgba(255,215,0,0.6); }
  .batik-sub { color:#e8c9a0; letter-spacing:3px; text-transform:uppercase; font-size:0.9rem; }
  .card { background:#2a1c12; margin:-40px 16px 20px; padding:28px; border-radius:24px; border:1px solid #5c4a2d; position:relative; z-index:3; box-shadow:0 10px 40px rgba(0,0,0,0.6); }
  #namaTamu { font-family:'Cinzel Decorative'; color:#ffd700; font-size:1.8rem; margin:10px 0; }
  .btn { display:inline-block; margin-top:18px; background: linear-gradient(135deg,#ffd700,#b8860b); color:#000; padding:14px 32px; border-radius:50px; font-weight:700; text-decoration:none; box-shadow:0 0 15px rgba(255,215,0,0.5); }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-content">
    <div class="batik-sub">Superhero Batik Solo</div>
    <h1>Kuro & Lena</h1>
    <p>We Are Getting Married</p>
  </div>
</div>

<div class="card">
  <p>Kepada Yth.</p>
  <h2 id="namaTamu">Tamu Undangan</h2>
  <p>Dengan penuh cinta, kami mengundang Anda untuk merayakan kisah superhero batik kami.</p>
  <p><strong>Sabtu, 20 Maret 2032 - 11:44 WIB</strong><br>Dalem Solo Heritage</p>
  
  <a id="rsvpBtn" class="btn" href="#" target="_blank">Konfirmasi via WhatsApp</a>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const namaTamu = params.get('to');
  const elNama = document.getElementById('namaTamu');
  const elBtn = document.getElementById('rsvpBtn');
  
  if (namaTamu) {
    const decoded = decodeURIComponent(namaTamu);
    elNama.innerText = decoded;
    // RSVP personal
    const waNumber = '6285647130819'; // GANTI NOMOR WA KAMU
    const waText = `Halo Kuro & Lena, saya ${decoded} konfirmasi akan hadir di undangan. Terima kasih!`;
    elBtn.href = `https://wa.me/${waNumber}?text=${encodeURIComponent(waText)}`;
  } else {
    elBtn.href = `https://wa.me/6281234567890?text=${encodeURIComponent('Halo Kuro & Lena, saya konfirmasi hadir!')}`;
  }
</script>

</body>
</html>
